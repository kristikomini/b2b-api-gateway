spring:
  application:
    name: b2b-api-gateway

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/b2b}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it. See ENGINEERING-STANDARDS.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer; the JwtDecoder (JWKS) is built from this at startup.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/b2b}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: b2b-api-gateway

logging:
  level:
    it.kristikomini.b2b: INFO
