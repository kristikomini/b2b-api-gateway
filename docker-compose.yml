services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: b2b, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d b2b" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: [ "8081:8080" ]
    # TODO(fill): mount ./ops/keycloak/realm-export.json into /opt/keycloak/data/import

  # TODO(fill): b2b-api-gateway app — build: .  depends_on: [ postgres, redis, keycloak ]
